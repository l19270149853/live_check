name: Live Stream Check

on:
  schedule:
    - cron: '0 22 * * *'   # 北京时间6点
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Run check script
        run: python check_live.py

      - - name: Commit & push results
  run: |
    git config user.name "l19270149853"
    git config user.email "362213335lkh@gmail.com"
    
    git add valid.txt
    git diff --cached --quiet || git commit -m "更新有效直播源 $(date -u +'%Y-%m-%d %H:%M UTC')"
    
    # 临时保存剩余的未暂存改动，清空工作区
    git stash --include-untracked
    
    git pull --rebase origin main
    git push
