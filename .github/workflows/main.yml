name: Live Stream Check

on:
  schedule:
    - cron: '0 22 * * *'   # 北京时间6点
  workflow_dispatch:

permissions:
  contents: write          # 允许 push 回仓库

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true   # 保留 token 用于 push

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Run check script
        run: python check_live.py

      - name: Commit & push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p results
          cp valid.txt invalid.txt summary.txt results/ 2>/dev/null || true
          git add results/ valid.txt invalid.txt summary.txt 2>/dev/null || true
          git diff --cached --quiet || git commit -m "更新直播源检测结果 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Upload results (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: live-results
          path: |
            valid.txt
            invalid.txt
            summary.txt
