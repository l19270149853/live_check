name: Live Stream Check

on:
  schedule:
    # 北京时间6点 = UTC时间22点（前一天）
    - cron: '0 22 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Run check script
        run: python check_live.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: live-results
          path: |
            valid.txt
            invalid.txt
            summary.txt
